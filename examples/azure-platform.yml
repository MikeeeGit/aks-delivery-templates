trigger: none
pr: none
parameters:
  - name: targetClusters
    type: object
    default: [aks01]
  - name: deploySequentially
    type: boolean
    default: true
resources:
  repositories:
    - repository: aksTemplates
      type: git
      name: ExampleProject/aks-delivery-templates
      ref: '9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179'
stages:
  - template: azure-pipelines/stages/platform-services.yml@aksTemplates
    parameters:
      serviceConnection: example-platform-oidc
      environment: pprd
      region: uks
      targetClusters: ${{ parameters.targetClusters }}
      deploySequentially: ${{ parameters.deploySequentially }}
      configFile: platform.services.json
      pool: {name: aks-private}
