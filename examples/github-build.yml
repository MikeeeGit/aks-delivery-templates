# Copy into a PRIVATE app .github/workflows/. Replace both zero SHAs before use.
name: Build application once
on: workflow_dispatch
permissions: {contents: read, id-token: write}
jobs:
  build:
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/build.yml@83aed5bfcf0134de02d7df569052681d563186d7
    with:
      template-ref: '83aed5bfcf0134de02d7df569052681d563186d7'
      client-id: ${{ vars.AZURE_APP_BUILD_CLIENT_ID }}
      build-environment: image-build
      runs-on: '["ubuntu-24.04"]'
