# Copy into a PRIVATE app .github/workflows/. Replace both zero SHAs before use.
name: Build application once
on: workflow_dispatch
permissions: {contents: read, id-token: write}
jobs:
  build:
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/build.yml@d15f578dd05d1becf162b5fa67b5d0503a06da4c
    with:
      template-ref: 'd15f578dd05d1becf162b5fa67b5d0503a06da4c'
      client-id: ${{ vars.AZURE_APP_BUILD_CLIENT_ID }}
      build-environment: image-build
      runs-on: '["ubuntu-24.04"]'
