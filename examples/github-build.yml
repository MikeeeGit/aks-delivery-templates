# Copy into a PRIVATE app .github/workflows/. Replace both zero SHAs before use.
name: Build application once
on: workflow_dispatch
permissions: {contents: read, id-token: write}
jobs:
  build:
    uses: MikeeeGit/aks-delivery-templates/.github/workflows/build.yml@9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179
    with:
      template-ref: '9fd0d6bd2e860c3f2e6a6aae4f154c8d3d309179'
      client-id: ${{ vars.AZURE_APP_BUILD_CLIENT_ID }}
      build-environment: image-build
      runs-on: '["ubuntu-24.04"]'
