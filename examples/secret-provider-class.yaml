# Optional CSI/workload identity example; replace identifiers, never embed secret values.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: platform-demo-secrets
  namespace: platform-demo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: EXAMPLE_APPLICATION_MANAGED_IDENTITY_CLIENT_ID
    keyvaultName: example-app-vault
    tenantId: EXAMPLE_TENANT_ID
    objects: |
      array:
        - |
          objectName: example-application-setting
          objectType: secret
# The pod also needs its annotated ServiceAccount, workload identity label and CSI volume.
